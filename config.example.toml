# CloudFlare Zero Trust Cleaner Configuration

[cloudflare]
# Your CloudFlare account ID (found in the dashboard URL or account settings)
# Can also be set via CF_ACCOUNT_ID environment variable
account_id = "your-account-id-here"

# API token with Zero Trust permissions
# Required permissions:
# - Account.Access: Audit Logs (Read) — to list users
# - Account.Zero Trust: Seats (Edit) — to revoke seats
# Create at: https://dash.cloudflare.com/profile/api-tokens
# Can also be set via CF_API_TOKEN environment variable
api_token = "your-api-token-here"

# Note: Environment variables take priority over config file values.
# A warning is shown if both are set.

# Permanent users list - these users will NOT have their seats revoked
[users]
permanent = [
    "admin@example.com",
    "developer@example.com",
    "support@example.com",
]
